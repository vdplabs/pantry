[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pantry"
version = "0.5.4"
description = "Open-source local and cluster AI model host for Apple Silicon and Linux (CUDA) with capability resolve, CAS deduplication, and OpenAI API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "VDP Labs" }]
keywords = ["mlx", "llm", "apple-silicon", "openai", "local-ai", "cuda", "speculative-decoding", "deduplication", "cas"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.8.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "huggingface_hub>=0.26.0",
  "python-multipart>=0.0.9",
  "psutil>=5.9.0",
  "numpy>=1.26.0",
  "pillow>=10.0.0",
  "opencv-python-headless>=4.8.0",
]

[project.urls]
Homepage = "https://github.com/vdplabs/pantry"
Documentation = "https://github.com/vdplabs/pantry#readme"
Repository = "https://github.com/vdplabs/pantry"
Issues = "https://github.com/vdplabs/pantry/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mlx>=0.22; sys_platform == 'darwin'",
  "mlx-lm>=0.22; sys_platform == 'darwin'",
]
mlx = ["mlx>=0.22", "mlx-lm>=0.22"]
whisper = ["mlx-whisper>=0.4.0"]
mflux = ["mflux>=0.19.0"]
music = ["mlx-audiogen>=0.2.0"]
menubar = ["rumps>=0.4.0"]
cuda = ["torch>=2.2.0", "transformers>=4.40.0", "accelerate>=0.30.0"]
vllm = ["vllm>=0.6.0"]
linux = ["psutil>=5.9.0", "torch>=2.2.0", "transformers>=4.40.0"]
# Default Mac host setup: inference + menu bar (what `pantry serve` expects).
mac = ["mlx>=0.22", "mlx-lm>=0.22", "rumps>=0.4.0"]
all = ["mlx>=0.22", "mlx-lm>=0.22", "mlx-whisper>=0.4.0", "mflux>=0.19.0", "mlx-audiogen>=0.2.0", "rumps>=0.4.0"]

[project.scripts]
pantry = "pantry.cli:app"

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "pantry/catalog"
"src/pantry/static" = "pantry/static"

[tool.hatch.build.targets.sdist]
include = ["src/pantry", "catalog", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

