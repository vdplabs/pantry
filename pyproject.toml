[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pantry"
version = "0.5.3"
description = "Local model host for Apple Silicon with capability resolve and an OpenAI-compatible API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "VDP Labs" }]
keywords = ["mlx", "llm", "apple-silicon", "openai", "local-ai"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.8.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "huggingface_hub>=0.26.0",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/vdplabs/pantry"
Documentation = "https://github.com/vdplabs/pantry#readme"
Repository = "https://github.com/vdplabs/pantry"
Issues = "https://github.com/vdplabs/pantry/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
mlx = ["mlx>=0.22", "mlx-lm>=0.22"]
whisper = ["mlx-whisper>=0.4.0"]
mflux = ["mflux>=0.19.0"]
menubar = ["rumps>=0.4.0"]
# Default Mac host setup: inference + menu bar (what `pantry serve` expects).
mac = ["mlx>=0.22", "mlx-lm>=0.22", "rumps>=0.4.0"]
all = ["mlx>=0.22", "mlx-lm>=0.22", "mlx-whisper>=0.4.0", "mflux>=0.19.0", "rumps>=0.4.0"]

[project.scripts]
pantry = "pantry.cli:app"

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "pantry/catalog"

[tool.hatch.build.targets.sdist]
include = ["src/pantry", "catalog", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

